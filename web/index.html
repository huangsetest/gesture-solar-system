<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手势太阳系 · Gesture Solar System</title>
    <!-- 内联 favicon, 避免 /favicon.ico 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='%23ffd166'/><ellipse cx='16' cy='16' rx='15' ry='6' fill='none' stroke='%230f0' stroke-width='2'/></svg>">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- 摄像头画面占位(骨架叠加层) -->
    <div class="camera-preview no-frame">
        <img id="video" alt="摄像头预览">
        <div class="placeholder">摄像头画面加载中...</div>
        <canvas id="videoOverlay" width="320" height="240"></canvas>
    </div>

    <!-- Three.js 主画布 -->
    <canvas id="canvas"></canvas>

    <!-- 数据面板 -->
    <div class="overlay">
        <div class="title">手势太阳系</div>

        <div class="data-panel">
            <div class="data-row">
                <span class="label">后端连接:</span>
                <span class="value" id="conn">连接中...</span>
            </div>
            <div class="data-row">
                <span class="label">手部位置:</span>
                <span class="value" id="hand-position">-</span>
            </div>
            <div class="data-row">
                <span class="label">识别帧率:</span>
                <span class="value" id="fps">--</span>
            </div>
            <div class="data-row">
                <span class="label">当前手势:</span>
                <span class="value" id="gesture">无</span>
            </div>
            <div class="data-row">
                <span class="label">偏离中心:</span>
                <span class="value" id="distance">-</span>
            </div>
            <div class="data-row">
                <span class="label">移动速度:</span>
                <span class="value" id="velocity">-</span>
            </div>
        </div>

        <div class="status" id="status">正在启动...</div>
    </div>

    <!-- 操作说明 -->
    <div class="instructions">
        <p><strong>手势操作:</strong></p>
        <p>✊ 握拳 + 移动 = 旋转视角</p>
        <p>✋ 张开手掌 + 移动 = 平移视角</p>
        <p>✌️ 食指中指 = 缩放(张开拉远/并拢拉近)</p>
        <p>🤟 三指 = 最佳视角</p>
        <p style="margin-top:8px;color:#8ab4f8">🖱 备选: 鼠标拖拽旋转 / 滚轮缩放</p>
    </div>

    <div class="developer-credit">
        <p>MediaPipe 本地推理 · Three.js 渲染</p>
        <p>渲染层改编自 <strong>aayusxat7/Gesture-Solar</strong></p>
    </div>

    <!-- 本地 three.js(离线, 不走 CDN) -->
    <script src="vendor/three.min.js"></script>

    <!-- 应用主程序(ES Module) -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
